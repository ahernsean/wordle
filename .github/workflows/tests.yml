name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install coverage numpy

      - name: Run test suite with coverage
        run: coverage run -m unittest discover -s tests -t . -p 'test_*.py'

      - name: Validate coordination floor (N tiny-branch workers not slower than 1)
        if: always()
        run: |
          python - <<'PY'
          import json, os, sys
          path = os.environ.get('COORDINATION_FLOOR_RESULT_PATH',
                                'coordination_floor_result.json')
          if not os.path.exists(path):
              print('Coordination-floor smoke did not run (skipped) — nothing to validate.')
              sys.exit(0)
          with open(path) as f:
              r = json.load(f)
          print(f"{r['workers']} workers vs 1 (cpu_count={r['cpu_count']}): "
                f"{r['speedup']:.2f}x speedup "
                f"(drain {r['tN_drain']:.3f}s vs {r['t1_drain']:.3f}s); "
                f"threshold >{r['min_speedup']:.2f}x")
          if not r['passed']:
              print(f"FAIL: {r['speedup']:.2f}x is below the {r['min_speedup']:.2f}x threshold")
              sys.exit(1)
          print('PASS')
          PY

      - name: Validate strong scaling (solve-dominated workload, issue 122 while red)
        if: always()
        run: |
          python - <<'PY'
          import json, os, sys
          path = os.environ.get('STRONG_SCALING_RESULT_PATH',
                                'strong_scaling_result.json')
          if not os.path.exists(path):
              print('Strong-scaling test did not run (skipped) — nothing to validate.')
              sys.exit(0)
          with open(path) as f:
              r = json.load(f)
          print(f"{r['workers']} workers vs 1 (cpu_count={r['cpu_count']}): "
                f"{r['speedup']:.2f}x speedup "
                f"(drain {r['tN_drain']:.3f}s vs {r['t1_drain']:.3f}s); "
                f"threshold >={r['min_speedup']:.2f}x")
          if r['passed']:
              print('PASS')
          elif r.get('scaling_currently_broken'):
              print(f"SPEEDUP ASSERTION INTENTIONALLY DISABLED — SCALING IS "
                    f"CURRENTLY BROKEN (issue #122): {r['speedup']:.2f}x is "
                    f"below the {r['min_speedup']:.2f}x threshold — reported, "
                    f"not enforced, until the claim-granularity redesign lands.")
          else:
              print(f"FAIL: {r['speedup']:.2f}x is below the {r['min_speedup']:.2f}x threshold")
              sys.exit(1)
          PY

      - name: Validate swarm overhead vs direct engine (one worker, one branch)
        if: always()
        run: |
          python - <<'PY'
          import json, os, sys
          path = os.environ.get('SWARM_OVERHEAD_RESULT_PATH',
                                'swarm_overhead_result.json')
          if not os.path.exists(path):
              print('Swarm-overhead test did not run (skipped) — nothing to validate.')
              sys.exit(0)
          with open(path) as f:
              r = json.load(f)
          print(f"swarm {r['swarm_wall']:.3f}s vs engine {r['engine_wall']:.3f}s: "
                f"{r['overhead_ratio']:.2f}x overhead "
                f"(max {r['max_overhead_factor']:.1f}x); "
                f"nodes {r['swarm_nodes']} vs {r['engine_nodes']}, "
                f"claims {r['claim_count']}, "
                f"coordination {r['coordination_millis']}ms")
          if not r['passed']:
              print(f"FAIL: {r['overhead_ratio']:.2f}x exceeds the "
                    f"{r['max_overhead_factor']:.1f}x overhead cap")
              sys.exit(1)
          print('PASS')
          PY

      - name: Enforce coverage threshold (>98%)
        run: coverage report --fail-under=98
