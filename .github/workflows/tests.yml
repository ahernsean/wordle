name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install coverage
        run: python -m pip install coverage

      - name: Run test suite with coverage
        run: coverage run -m unittest discover -s . -p 'test_*.py'

      - name: Enforce coverage threshold (>98%)
        run: coverage report --fail-under=98
