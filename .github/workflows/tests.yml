name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install coverage numpy

      - name: Run unit suite with coverage
        run: |
          test_modules=()
          for test_file in tests/test_*.py; do
            case "$test_file" in
              tests/test_report_client.py|tests/test_erd_parallel.py|tests/test_erd_scaling.py|tests/test_swarm_vs_engine_overhead.py)
                continue
                ;;
            esac
            module=${test_file%.py}
            test_modules+=("${module//\//.}")
          done
          coverage run --parallel-mode -m unittest "${test_modules[@]}"

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: .coverage.*
          include-hidden-files: true

  browser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install coverage numpy playwright

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser suite with coverage
        run: coverage run --parallel-mode -m unittest tests.test_report_client
        env:
          REQUIRE_PLAYWRIGHT_BROWSER: "1"

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-browser
          path: .coverage.*
          include-hidden-files: true

  webkit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install coverage numpy playwright

      # The browser itself runs inside the Microsoft Playwright container
      # (tests/webkit_container.py), image tag matched to the installed
      # playwright package's version, so no local WebKit install is needed.
      - name: Run WebKit browser suite with coverage
        run: coverage run --parallel-mode -m unittest tests.test_report_client.ReportClientWebKitBrowserTest
        env:
          REQUIRE_WEBKIT_CONTAINER_TESTS: "1"

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-webkit
          path: .coverage.*
          include-hidden-files: true

  scaling:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install coverage numpy

      # Strong scaling requires four idle cores, so this runner has no unrelated tests.
      - name: Run swarm integration and scaling suite with coverage
        run: coverage run --parallel-mode -m unittest tests.test_erd_parallel tests.test_erd_scaling tests.test_swarm_vs_engine_overhead

      - name: Validate claim-handout drain (N workers not slower than 1)
        if: always()
        run: |
          python - <<'PY'
          import json, os, sys
          path = os.environ.get('DRAIN_SMOKE_RESULT_PATH',
                                'drain_smoke_result.json')
          if not os.path.exists(path):
              print('Claim-handout drain smoke did not run (skipped) — nothing to validate.')
              sys.exit(0)
          with open(path) as f:
              r = json.load(f)
          print(f"{r['workers']} workers vs 1 (cpu_count={r['cpu_count']}): "
                f"{r['speedup']:.2f}x speedup "
                f"(drain {r['tN_drain']:.3f}s vs {r['t1_drain']:.3f}s); "
                f"threshold >{r['min_speedup']:.2f}x")
          if not r['passed']:
              print(f"FAIL: {r['speedup']:.2f}x is below the {r['min_speedup']:.2f}x threshold")
              sys.exit(1)
          print('PASS')
          PY

      - name: Validate strong scaling (solve-dominated workload)
        if: always()
        run: |
          python - <<'PY'
          import json, os, sys
          path = os.environ.get('STRONG_SCALING_RESULT_PATH',
                                'strong_scaling_result.json')
          if not os.path.exists(path):
              print('Strong-scaling test did not run (skipped) — nothing to validate.')
              sys.exit(0)
          with open(path) as f:
              r = json.load(f)
          print(f"{r['workers']} workers vs 1 (cpu_count={r['cpu_count']}): "
                f"{r['speedup']:.2f}x speedup "
                f"(drain {r['tN_drain']:.3f}s vs {r['t1_drain']:.3f}s); "
                f"threshold >={r['min_speedup']:.2f}x")
          if r['passed']:
              print('PASS')
          else:
              print(f"FAIL: {r['speedup']:.2f}x is below the {r['min_speedup']:.2f}x threshold")
              sys.exit(1)
          PY

      - name: Validate swarm overhead vs direct engine (one worker, one branch)
        if: always()
        run: |
          python - <<'PY'
          import json, os, sys
          path = os.environ.get('SWARM_OVERHEAD_RESULT_PATH',
                                'swarm_overhead_result.json')
          if not os.path.exists(path):
              print('Swarm-overhead test did not run (skipped) — nothing to validate.')
              sys.exit(0)
          with open(path) as f:
              r = json.load(f)
          print(f"swarm {r['swarm_wall']:.3f}s vs engine {r['engine_wall']:.3f}s: "
                f"{r['overhead_ratio']:.2f}x overhead "
                f"(max {r['max_overhead_factor']:.1f}x); "
                f"nodes {r['swarm_nodes']} vs {r['engine_nodes']}, "
                f"claims {r['claim_count']}, "
                f"coordination {r['coordination_millis']}ms")
          if not r['passed']:
              print(f"FAIL: {r['overhead_ratio']:.2f}x exceeds the "
                    f"{r['max_overhead_factor']:.1f}x overhead cap")
              sys.exit(1)
          print('PASS')
          PY

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-scaling
          path: .coverage.*
          include-hidden-files: true

  test:
    if: always()
    needs: [unit, browser, webkit, scaling]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Require every test suite to pass
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          WEBKIT_RESULT: ${{ needs.webkit.result }}
          SCALING_RESULT: ${{ needs.scaling.result }}
        run: test "$UNIT_RESULT $BROWSER_RESULT $WEBKIT_RESULT $SCALING_RESULT" = "success success success success"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install coverage
        run: python -m pip install coverage

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      - name: Enforce coverage threshold (>98%)
        run: |
          coverage combine coverage
          coverage report --fail-under=98
