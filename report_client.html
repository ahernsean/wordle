<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ERD swarm reports</title>
  <style>
    :root { color-scheme: light; --bg:#ffffff; --panel:#f8f9fa; --text:#1a1a1b; --dim:#787c7e; --green:#6aaa64; --green-complete:#9fc09f; --yellow:#c9b458; --gray:#787c7e; --border:#d3d6da; --sweep-empty:#d3d6da; --red:#d14b4b; --amber:#b59f3b; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-width:0; background:var(--bg); color:var(--text); font:13px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace; }
    body { overflow-x:hidden; }
    button, input, select { min-height:30px; border:1px solid var(--border); border-radius:5px; background:#ffffff; color:var(--text); font:inherit; padding:.25rem .5rem; }
    button { cursor:pointer; }
    button:disabled { cursor:default; opacity:.45; }
    button:hover, button[aria-current="page"], button[aria-pressed="true"] { border-color:var(--green); background:#edf5ec; }
    .layout-toggle { display:inline-flex; align-items:center; gap:.35rem; margin-left:.25rem; padding-left:.6rem; border-left:1px solid var(--border); }
    .layout-toggle[hidden] { display:none; }
    .layout-toggle .cap { color:var(--dim); font-size:.8rem; white-space:nowrap; }
    .layout-toggle .seg { display:inline-flex; }
    .layout-toggle .seg button { border-radius:0; }
    .layout-toggle .seg button:first-child { border-radius:5px 0 0 5px; }
    .layout-toggle .seg button:last-child { border-radius:0 5px 5px 0; margin-left:-1px; }
    input[type="checkbox"] { min-height:auto; accent-color:var(--green); }
    header { position:sticky; top:0; z-index:5; background:rgba(255,255,255,.97); border-bottom:1px solid var(--border); padding:.4rem clamp(.5rem,1.5vw,1rem); }
    .nav, .branch-target, .metrics, .chips, .row-actions { display:flex; flex-wrap:wrap; gap:.35rem; align-items:center; }
    .branch-target { margin-top:.35rem; flex-wrap:nowrap; }
    #branch-target-input { flex:1 1 8rem; min-width:6rem; }
    details.root-progress-panel { border:1px solid var(--border); border-radius:6px; background:var(--panel); padding:.4rem .5rem; margin:.5rem 0; }
    details.root-progress-panel > summary { cursor:pointer; font-weight:bold; }
    /* The table is wider than a phone and longer than a screen; it scrolls
       inside this box on both axes so the page body never does. */
    .root-progress-scroll { overflow:auto; max-height:60vh; overscroll-behavior:contain; margin-top:.4rem; }
    table.root-progress { border-collapse:collapse; white-space:nowrap; }
    table.root-progress th, table.root-progress td { padding:.15rem .5rem; text-align:right; }
    table.root-progress td { border-bottom:1px solid var(--border); }
    /* A collapsed border does not travel with a sticky header, so the rule
       under the header row is drawn as an inset shadow. */
    table.root-progress thead th { position:sticky; top:0; z-index:1; background:var(--panel); box-shadow:inset 0 -1px 0 var(--border); }
    table.root-progress th:first-child, table.root-progress td:first-child { text-align:left; }
    table.root-progress tr.dim td { color:var(--dim); }
    table.root-progress td.state-solved { color:var(--green); }
    table.root-progress td.state-loss { color:var(--red); }
    table.root-progress td.state-waiting { color:var(--dim); }
    details.filters { margin-top:.35rem; color:var(--dim); }
    details.filters > summary { cursor:pointer; padding:.1rem 0; }
    .control-group { border:1px solid var(--border); border-radius:6px; background:var(--panel); padding:.4rem .5rem; margin-top:.4rem; }
    .control-group[hidden] { display:none; }
    .group-head { display:flex; align-items:baseline; gap:.5rem; }
    .group-head .gname { font-weight:700; color:var(--text); }
    .group-head .ghint { color:var(--dim); font-size:.82rem; }
    /* Fields size to their content and wrap; a numeric input is capped to its
       magnitude rather than stretched to a shared column width. */
    .field-flow { display:flex; flex-wrap:wrap; gap:.4rem .85rem; align-items:end; margin-top:.35rem; }
    .field-flow input[type="number"] { width:4.2rem; text-align:right; padding-left:.35rem; padding-right:.35rem; }
    .field-flow input.narrow { width:2.9rem; } .field-flow input.medium { width:3.4rem; }
    .field { display:grid; gap:.1rem; color:var(--dim); }
    .field[hidden] { display:none; }
    .fieldlabel { display:flex; align-items:baseline; gap:.3rem; }
    .status-line { display:flex; flex-wrap:wrap; gap:.4rem; align-items:baseline; padding:.15rem 0; }
    .status-line > .label { color:var(--dim); }
    .statuses { display:flex; flex-wrap:wrap; gap:.5rem; align-items:baseline; }
    .statuses label { display:inline-flex; gap:.25rem; align-items:center; white-space:nowrap; }
    .conn-wrap { position:relative; margin-left:auto; }
    #connection { color:var(--green); padding:.1rem .3rem; white-space:nowrap; cursor:pointer; border-radius:4px; user-select:none; }
    #connection.disconnected { color:#ffffff; background:var(--red); border-radius:4px; }
    #connection:focus-visible { outline:2px solid var(--green); outline-offset:1px; }
    .conn-wrap.open #connection:not(.disconnected) { background:#edf5ec; }
    .refresh-pop { position:absolute; top:100%; right:0; z-index:20; margin-top:.2rem; padding:.35rem .5rem; background:#ffffff; border:1px solid var(--border); border-radius:6px; box-shadow:0 5px 16px rgba(0,0,0,.14); display:flex; align-items:center; gap:.4rem; white-space:nowrap; color:var(--text); opacity:0; visibility:hidden; transform:translateY(-3px); transition:opacity .12s ease, transform .12s ease, visibility .12s; }
    .refresh-pop .cap { color:var(--dim); font-size:.8rem; }
    .refresh-pop input { width:4.5rem; text-align:right; }
    .conn-wrap.open .refresh-pop { opacity:1; visibility:visible; transform:none; }
    /* Where the pointer can hover, opening on hover is layered on top of the
       tap-toggle; a transparent bridge spans the gap so crossing to the panel
       does not dismiss it. */
    @media (hover:hover) and (pointer:fine) {
      .refresh-pop::before { content:""; position:absolute; left:0; right:0; top:-.4rem; height:.4rem; }
      .conn-wrap:hover #connection:not(.disconnected) { background:#edf5ec; }
      .conn-wrap:hover .refresh-pop, .refresh-pop:hover { opacity:1; visibility:visible; transform:none; }
    }
    main { width:min(1200px,100%); margin:auto; padding:.5rem clamp(.5rem,1.5vw,1rem) 2rem; }
    .report-meta { display:flex; flex-wrap:wrap; gap:.2rem .6rem; align-items:baseline; margin:.2rem 0 .35rem; }
    details.source-paths { display:inline-block; }
    details.source-paths[open] { display:block; flex-basis:100%; }
    details.source-paths > summary { cursor:pointer; font-size:1em; font-weight:normal; }
    h1,h2,h3 { margin:.4rem 0 .25rem; }
    h1 { font-size:1rem; display:inline; }
    h2 { font-size:.95rem; }
    h3 { font-size:.9rem; margin:0; }
    .dim, .source, .empty { color:var(--dim); }
    .error { border-left:4px solid var(--red); padding:.4rem .6rem; background:#fff1f1; }
    .metrics { margin:.3rem 0; gap:.15rem 1rem; }
    .metric { display:inline-flex; gap:.35rem; align-items:baseline; min-width:0; flex:0 1 auto; }
    .metric strong { overflow-wrap:anywhere; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr)); gap:.4rem; }
    .grid.workers { grid-template-columns:repeat(auto-fill,minmax(min(100%,12.5rem),1fr)); }
    .card, .section { min-width:0; background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:.4rem .55rem; overflow-wrap:anywhere; }
    .section { margin:.45rem 0; }
    .card.active { border-color:var(--green); }
    .card.finalizing, .stale { border-color:var(--amber); }
    .card.transitioning { border-color:var(--dim); }
    .dead { border-color:var(--red); }
    .card-title { display:flex; flex-wrap:wrap; gap:.35rem; align-items:baseline; }
    .worker .card-title { gap:.2rem; }
    /* Each item (name, state chip, candidate tiles) wraps to its own line as a
       whole when the row doesn't fit -- never clipped, never split.  overflow-wrap
       normally lets a nowrap span break mid-word to avoid overflow; .card sets it
       to "anywhere" for long unrelated content, so it must be countered here or
       that inherited rule breaks these items internally instead of wrapping the row. */
    .worker .card-title > * { flex:0 0 auto; white-space:nowrap; overflow-wrap:normal; }
    .chip { display:inline-block; border:1px solid var(--border); border-radius:999px; padding:.05rem .4rem; color:var(--dim); font-size:.85em; }
    .chip.exact, .outcome-exact { border-color:var(--green); color:#3e7c3a; }
    .chip.cut, .outcome-cut { border-color:var(--amber); color:#7d6812; }
    .chip.loss, .outcome-loss { border-color:var(--red); color:#a32c2c; }
    .chip.historical { border-color:var(--dim); color:var(--dim); background:#ffffff; }
    .card.historical { border-style:dashed; background:#f3f4f6; }
    /* A spine is one row of guesses or a column of them, never a ragged mix:
       it lays out on a single row, and layoutSpines drops the whole spine to a
       column when that row will not fit.  Guesses are separated by well more
       than the gap between letters, so a row reads as distinct words. */
    .tiles { display:flex; flex-wrap:nowrap; overflow:hidden; gap:.3rem 1rem; align-items:center; margin:.2rem 0; }
    .tiles.stacked { flex-direction:column; align-items:flex-start; overflow:visible; }
    .step-group { display:inline-flex; gap:.3rem; align-items:center; white-space:nowrap; }
    /* A guess is drawn as its five letters over the colors of its response:
       one square tile per letter, no corner radius, gap and letter size both
       proportional to the tile.  Sizes are held on whole pixels -- a fractional
       tile height puts the centered line box on a fraction and the glyph then
       snaps up to a pixel off center. */
    :root { --tile-base:15px; --tile-gap-ratio:.07; --tile-font-ratio:.62; --tile-outline-ratio:.023; --tile-notch-ratio:.38; }
    .word-sm { --tile:var(--tile-base); }
    .word-md { --tile:20px; --tile:round(calc(var(--tile-base) * 1.3),1px); }
    .word-lg { --tile:27px; --tile:round(calc(var(--tile-base) * 1.8),1px); }
    /* Nothing inside a word is a flex or grid item: those are blockified, and a
       block serializes with a line break, which would make a copied word arrive
       as one letter per line.  font-size:0 on the row keeps any whitespace
       between tiles from opening a gap of its own. */
    .word { display:inline-block; white-space:nowrap; font-size:0; --tile-notch-inset:max(1px,calc(var(--tile) * .07)); }
    /* No vertical-align: the tile's single line box fills its height, so the
       letters carry a real text baseline and the row inherits it.  Default
       baseline alignment then seats the tile letters on the baseline of the
       text beside them at every scale.  padding-top carries the centering
       correction measured in centerLetters -- it moves the glyph without
       moving the tile behind it. */
    .word > .letter { position:relative; display:inline-block; text-align:center; width:var(--tile); height:var(--tile); line-height:var(--tile); padding-top:var(--letter-shift,0px); margin-right:calc(var(--tile) * var(--tile-gap-ratio)); font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-size:calc(var(--tile) * var(--tile-font-ratio)); font-weight:700; color:#ffffff; background:var(--gray); text-transform:uppercase; }
    .word > .letter:nth-child(5) { margin-right:0; }
    .word > .letter.g { background:var(--green); } .word > .letter.y { background:var(--yellow); }
    /* A guess with no response is the unplayed tile: white, gray outline, dark
       letters.  The outline is inset so the tile keeps the same outer box as a
       colored one and rows of both sit on a shared grid. */
    .word > .letter.blank { background:#ffffff; color:var(--text); box-shadow:inset 0 0 0 max(1px,calc(var(--tile) * var(--tile-outline-ratio))) #878a8c; }
    /* A guess that is itself a possible answer is notched at the corner of its
       last tile.  currentColor is already the tile's letter color, so one rule
       covers every tone.  The notch is held off the corner: flush to the edge,
       a white notch on a colored tile merges with the page behind it and reads
       as a bite out of the tile rather than a mark on it. */
    .word.is-answer > .letter:nth-child(5)::after { content:""; position:absolute; top:var(--tile-notch-inset); right:var(--tile-notch-inset); border-top:calc(var(--tile) * var(--tile-notch-ratio)) solid currentColor; border-left:calc(var(--tile) * var(--tile-notch-ratio)) solid transparent; }
    /* A word and the ERD it earned are one unit: the tiles butt against the
       slash, and the pair never breaks across a line. */
    .word-erd { white-space:normal; }
    .word-erd > .word-erd-pair { white-space:nowrap; }
    .progress-line { margin:.25rem 0; }
    .progress { height:.3rem; border-radius:999px; background:var(--border); overflow:hidden; }
    .progress > span { display:block; height:100%; background:var(--green); }
    /* Facts pack onto a wrapping row separated by a drawn middot rather than
       literal " · " text, at a smaller size than the panel's identity line.
       Each fact is its own nowrap span, so a number never breaks mid-digit and
       "best CRANE*" never splits from its value. */
    .stat-line { display:flex; flex-wrap:wrap; font-size:.8rem; margin-top:.15rem; }
    /* The same packing inline, where facts follow an identity on its own line
       instead of starting a row of their own.  The flex container is what
       creates the break opportunities between facts: adjacent nowrap spans
       with no text node between them are one unbreakable inline box. */
    .inline-facts { display:inline-flex; flex-wrap:wrap; margin-left:.35rem; }
    .stat-line > span, .inline-facts > span { white-space:nowrap; }
    .stat-line > span:not(:last-child)::after, .inline-facts > span:not(:last-child)::after { content:"·"; color:var(--border); margin:0 .3em; }
    .sweep { display:flex; gap:1px; height:1.25rem; margin:.3rem 0; position:relative; }
    .progress-line .sweep { height:1rem; margin:0 0 .3rem; }
    .sweep-cell { flex:1 1 0; min-width:2px; border-radius:1px; background:linear-gradient(to top,var(--green) var(--fill,0%),var(--sweep-empty) var(--fill,0%)); }
    /* A fully-done cell is drawn desaturated so "completely full" reads as a
       distinct state from a nearly-full cell rather than blending with it. */
    .sweep-cell.complete { background:var(--green-complete); }
    /* The digit is an SVG background image, not laid-out text: SVG
       rasterization places the glyph geometrically, so the digit stays
       centered at any sub-pixel cell position where HTML text layout would
       snap the baseline to a whole pixel and drift up to a pixel off center.
       min-width keeps a marker at least a digit wide when cells are only a few
       pixels.  The marker has no fill of its own — the digit carries a light
       halo (drawn in the SVG) so it reads over both green and gray while the
       cell's own fill stays visible straight through it. */
    .sweep-marker { position:absolute; top:0; height:100%; min-width:.85rem; z-index:1; background-position:center; background-repeat:no-repeat; transition:left .4s ease, opacity .4s ease; }
    /* A small solid pointer in the strip of white space under the ramp, apex
       almost touching the worker's cell.  It is part of the marker, so it
       rides the same slide and fade as the digit. */
    .sweep-marker::after { content:""; position:absolute; top:calc(100% + 1px); left:50%; transform:translateX(-50%); width:0; height:0; border-left:.2rem solid transparent; border-right:.2rem solid transparent; border-bottom:.26rem solid var(--text); }
    .labeled-facts { display:flex; flex-wrap:wrap; gap:.05rem .9rem; }
    .labeled-facts .fact { display:inline-block; min-width:0; overflow-wrap:anywhere; }
    .labeled-facts .fact-label { color:var(--dim); }
    /* The base words sit flush at the page margin; a rail is drawn only where
       it separates siblings from the guess they branch off. */
    .tree { list-style:none; margin:0; padding:0; }
    .tree ul { list-style:none; margin:.2rem 0 .2rem .5rem; padding-left:.6rem; border-left:1px solid var(--border); }
    /* A word and its response patterns are one unit, so the rail marks descent
       into a branch and never the step from a word to its own patterns. */
    .tree ul.patterns { margin-left:.3rem; padding-left:.5rem; border-left:none; }
    .tree summary { cursor:pointer; min-height:28px; padding:.15rem 0; }
    .tree-pager { display:flex; flex-wrap:wrap; gap:.4rem; align-items:center; margin:.45rem 0; }
    .clickable { cursor:pointer; }
    .clickable:hover { border-color:var(--green); }
    .badge { background:var(--red); color:white; border-radius:4px; padding:.1rem .35rem; }
    .leave-layer { position:fixed; inset:0; pointer-events:none; z-index:50; }
    .flash-added { animation:added 1.5s; } .flash-improved { animation:improved 1.5s; } .flash-changed { animation:changed 1.5s; }
    @keyframes added { from { box-shadow:0 0 0 3px var(--green); } }
    @keyframes improved { from { border-color:var(--green); background:#e8f4e7; } }
    @keyframes changed { from { border-color:var(--red); background:#fff0f0; } }
    @media (max-width:600px) {
      header { position:static; }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav" id="report-nav">
      <button data-kind="auto" data-overview="1">Overview</button><button data-kind="queue">Queue</button><button data-kind="workers">Workers</button><button data-kind="cache">Cache</button><button data-kind="hotspots">Hotspots</button><button data-kind="leaderboard">Leaderboard</button><span class="layout-toggle" id="layout-toggle" role="group" aria-label="View layout"><span class="cap">View as</span><span class="seg"><button id="layout-flat" aria-pressed="true">Flat</button><button id="layout-tree" aria-pressed="false">Tree</button></span></span>
      <span class="conn-wrap">
        <span id="connection" aria-label="Poll status; opens refresh interval">●</span>
        <div class="refresh-pop">
          <span class="cap">Refresh every</span>
          <input id="poll" type="number" min="200" aria-label="Refresh interval (ms)">
          <span class="cap">ms</span>
        </div>
      </span>
    </div>
    <div class="branch-target">
      <input id="branch-target-input" placeholder="Spine or @branch" aria-label="Spine or @branch" autocomplete="off" spellcheck="false">
      <button id="apply">Go</button><button id="back">Back</button>
    </div>
    <details class="filters"><summary>Filters &amp; view</summary>
      <div class="control-group" id="filters-group">
        <div class="group-head"><span class="gname">Filters:</span><span class="ghint">narrow the branches — applied as you change them</span></div>
        <div class="status-line"><span class="label">Branch status</span><span class="statuses" id="branch-statuses"></span></div>
        <div class="status-line"><span class="label">Branch phase</span><span class="statuses" id="branch-phases"></span></div>
        <div class="dim lifecycle-legend">Phase: queued → evaluating → finalizing → complete. Status: worker active or not.</div>
        <div class="field-flow">
          <label class="field">Min answers<input id="minimum-answer-count" type="number"></label>
          <label class="field">Max answers<input id="maximum-answer-count" type="number"></label>
          <label class="field">Budget<input id="budget" class="narrow" type="number"></label>
          <label class="field">Priority<input id="priority" class="medium" type="number"></label>
        </div>
      </div>
      <div class="control-group" id="view-group">
        <div class="group-head"><span class="gname">View</span><span class="ghint">order &amp; scope what's shown</span></div>
        <div class="field-flow">
          <label class="field" id="sort-field"><span class="fieldlabel">Sort</span><select id="sort"></select></label>
          <label class="field" id="group-by-field"><span class="fieldlabel">Group by</span><select id="group-by"><option value="">none</option><option value="status">status</option><option value="answer_count">answer count</option><option value="cache_state">cache state</option><option value="worker_presence">worker</option><option value="priority">priority</option></select></label>
          <label class="field" id="limit-field"><span id="limit-label">Branches shown</span><input id="limit" type="number" min="1"></label>
          <label class="field" id="by-field"><span class="fieldlabel">Hotspot field</span><select id="by"><option value="">nodes</option><option>age</option><option>size</option><option>workers</option><option>priority</option><option>slowest</option><option>evaluated-candidates</option><option>bulk-completed-candidates</option><option>cut-reuse</option><option>coordination</option></select></label>
          <label class="field" id="epoch-field">Epoch<input id="epoch" class="narrow" type="number"></label>
          <label class="field" id="since-seconds-field"><span class="fieldlabel">Stats window (s)</span><input id="since-seconds" type="number" min="1" title="time window for hotspot aggregation"></label>
        </div>
      </div>
    </details>
  </header>
  <main id="report"><p class="empty">Loading report…</p></main>
  <script>
  (() => {
    "use strict";
    const SCHEMA_VERSION=2, DEFAULT_POLL=2000, STUCK_REQUEST_MILLIS=60000, SLOW_REQUEST_MILLIS=2000;
    const branchStatusNames=["active","pending","done","unqueued"];
    const branchPhaseNames=["queued","evaluating","finalizing","complete"];
    // iOS Safari's native <select> picker ignores the "hidden" attribute on
    // <option> elements, so context-dependent choices are rebuilt into the
    // DOM rather than toggled — an absent option can't appear in any picker.
    const SORT_OPTIONS_DEFAULT=[["","default"],["age","age"],["size","size"],["workers","workers"],["priority","priority"],["nodes","nodes"],["slowest","slowest"]];
    const SORT_OPTIONS_WORD=[["size","size (default)"],["workers","workers"],["priority","priority"]];
    const explicitKinds=new Set(["queue","workers","cache","hotspots","leaderboard"]);
    const treelessKinds=new Set(["cache","hotspots","leaderboard"]);
    const populationNames={current_queue_branches:"current queue branches",recent_branch_finalizations:"recent branch finalizations",recent_cut_reuse_misses:"recent cut-reuse misses",recent_claim_coordination_buckets:"recent claim coordination buckets"};
    const collapsedNodes=new Set(), initializedNodes=new Set(), collapsedWordGroups=new Set(), initializedWordGroups=new Set(), collapsedResponseGroups=new Set(), stickyOrders=new Map(), treePageHistory=new Map(), treeGroupPages=new Map();
    let currentState, lastReport=null, lastContext=null, failureCount=0, lastSuccess=null, pollTimer=null, comparisonAvailable=false,requestGeneration=0,activeRequestController=null,activeRequestStartedAt=0,slowRequestTimer=null,shownBranchTarget=null,sourcePathsOpen=false,rootProgressOpen=true;
    // The root-progress scan takes seconds, so a result is held per target and
    // reused across the poll cycle's re-renders; refreshing is explicit.
    const rootProgressCache=new Map(), rootProgressPending=new Set(), rootProgressScroll=new Map(), rootProgressFailure=new Map();
    const byId=id=>document.getElementById(id);
    const element=(tag,className,text)=>{const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=String(text);return node;};
    const formatInteger=value=>value===null||value===undefined?"—":Number(value).toLocaleString("en-US");
    const valueOrDash=value=>{if(value===null||value===undefined||value==="")return "—";if(typeof value==="number"&&Number.isInteger(value))return formatInteger(value);return String(value);};
    const numText=formatInteger;
    const boundFields=new Set(["best_erd","erd","ceiling","bound_erd","available_bound","wanted_ceiling"]);
    const ERD_LATTICE_NOISE_MARGIN=1e-6, CEILING_EPS=1e-9;
    const fixed=(value,digits=3)=>value===null||value===undefined?null:Number(value).toFixed(digits);
    const erdValue=(value,answerCount,{ceiling=false}={})=>{
      const decimal=fixed(value);if(decimal===null||!Number.isFinite(Number(value))||!Number.isInteger(answerCount)||answerCount<=0)return decimal;
      const scaled=Number(value)*answerCount,numerator=Math.round(scaled),allowance=ERD_LATTICE_NOISE_MARGIN+(ceiling?answerCount*CEILING_EPS:0);
      return Math.abs(scaled-numerator)<allowance?decimal+" "+numerator+"/"+answerCount:decimal;

      for(const node of root.querySelectorAll(".grid > [data-identity]"))map.set(node.dataset.identity,{rect:node.getBoundingClientRect(),node});
      return map;
    }
    function animateGridTransitions(root,before,sameView){
      if(!sameView||!before.size||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
      const present=new Set();
      for(const node of root.querySelectorAll(".grid > [data-identity]")){
        present.add(node.dataset.identity);
        const prior=before.get(node.dataset.identity);
        if(prior){
          // FLIP: a card that survived the refresh glides from where it was to
          // where it landed, so watching one branch never means chasing it.
          const after=node.getBoundingClientRect(),dx=prior.rect.left-after.left,dy=prior.rect.top-after.top;
          if(dx||dy)node.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:"none"}],{duration:350,easing:"ease",fill:"forwards"});
        }else{
          // A brand-new card grows in from the right while fading up to full
          // size, rather than just barely swelling in place -- the same
          // leftward-exit/rightward-entry language as the departure below, so
          // a card being replaced by an unrelated one reads as a clear
          // handoff even though the two never share a slot.
          node.animate([{opacity:0,transform:"translateX(50px) scale(.7)"},{opacity:1,transform:"none"}],{duration:380,easing:"ease-out",fill:"forwards"});
        }
      }
      const leaving=[...before].filter(([identity])=>!present.has(identity));
      if(!leaving.length)return;
      const layer=element("div","leave-layer");document.body.append(layer);
      for(const [,{rect,node}] of leaving){
        const clone=node.cloneNode(true);
        Object.assign(clone.style,{position:"fixed",margin:"0",left:rect.left+"px",top:rect.top+"px",width:rect.width+"px",height:rect.height+"px"});
        layer.append(clone);
        // fill:"forwards" holds the faded-out end state until layer.remove()
        // below actually deletes the clone -- without it, the browser drops
        // the animation's effect the instant it ends and the clone reverts to
        // its un-animated style (fully opaque), flashing back into view for
        // the remaining time before removal.
        clone.animate([{opacity:1,transform:"none"},{opacity:0,transform:"translateX(-50px) scale(.7)"}],{duration:380,easing:"ease-in",fill:"forwards"});
      }
      setTimeout(()=>layer.remove(),400);
    }
    function reportHasFocusedControl(){
      const active=document.activeElement;
      return (!!active&&["SELECT","INPUT","TEXTAREA","SUMMARY"].includes(active.tagName)&&byId("report").contains(active))||!!byId("report").querySelector("details.tree-branch[open]");
    }
    function reportHasActiveSelection(){
      const selection=getSelection();
      if(!selection||selection.isCollapsed||!selection.rangeCount)return false;
      return byId("report").contains(selection.getRangeAt(0).commonAncestorContainer);
    }
    function applyReport(report,previousReport,state){
      if(!report||report.schema_version!==SCHEMA_VERSION||!report.data||!report.sources)throw new Error("Unsupported or malformed report");
      const root=byId("report"),beforeCards=captureGridCards(root),content=document.createDocumentFragment();comparisonAvailable=previousReport!==null;document.querySelector("details.filters").hidden=report.report_kind==="branch_reference_matches";if(report.report_kind!=="branch_reference_matches")content.append(reportHeader(report,state));
      if(report.tree)content.append(renderTree(report,previousReport,state));else if(report.report_kind==="overview")content.append(renderOverview(report,previousReport,state));else if(report.report_kind==="word")content.append(renderWord(report,previousReport,state));else if(report.report_kind==="branch")content.append(renderBranch(report,previousReport,state));else if(report.report_kind==="branch_reference_matches")content.append(renderBranchReferenceMatches(report));else if(report.report_kind==="queue")content.append(renderQueue(report,previousReport,state));else if(report.report_kind==="workers")content.append(renderWorkers(report,previousReport,state));else if(report.report_kind==="cache")content.append(renderCache(report,previousReport));else if(report.report_kind==="hotspots")content.append(renderHotspots(report,previousReport,state));else if(report.report_kind==="leaderboard")content.append(renderLeaderboard(report,previousReport,state));else throw new Error("Unknown report kind");
      // Only glide cards on a refresh of the same view; switching report kinds
      // (or the first paint over a stale screen) snaps rather than stampedes.
      const sameView=!!previousReport&&previousReport.report_kind===report.report_kind&&!!previousReport.tree===!!report.tree;
      centerLetters();root.replaceChildren(content);layoutSpines(root);animateSweepMarkers(root);animateGridTransitions(root,beforeCards,sameView);setTimeout(()=>document.querySelectorAll(".flash-added,.flash-improved,.flash-changed").forEach(node=>node.classList.remove("flash-added","flash-improved","flash-changed")),1500);return root;
    }
    function workerMarkerImage(workerNumber){
      const svg='<svg xmlns="http://www.w3.org/2000/svg"><text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="8.45" font-weight="bold" paint-order="stroke" stroke="#f8f9fa" stroke-width="2.5" stroke-linejoin="round" fill="#1a1a1b">'+workerNumber+'</text></svg>';
      return 'url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
    }
    function connection(ok,message,disconnected=!ok){const chip=byId("connection");chip.classList.toggle("disconnected",disconnected);chip.textContent=ok?"●":"● "+message;const status=ok?"connected":message;chip.title=status;chip.setAttribute("aria-label",status+"; opens refresh interval");}
    async function fetchReport(){
      if(document.hidden)return;
      if(activeRequestController){
        if(Date.now()-activeRequestStartedAt<STUCK_REQUEST_MILLIS)return;
        abortActiveRequest();
      }
      const state=normalizeState(currentState),context=contextKey(state),generation=++requestGeneration,controller=new AbortController();
      activeRequestController=controller;activeRequestStartedAt=Date.now();
      // On a view switch (new context), a slow report — the leaderboard folds
      // every candidate — would otherwise leave a blank pane; show a notice if
      // it has not arrived within SLOW_REQUEST_MILLIS.  Same-context polls keep
      // the current data on screen and never show it.
      clearSlowRequestNotice();
      if(context!==lastContext){slowRequestTimer=setTimeout(()=>{if(generation===requestGeneration)byId("report").replaceChildren(element("p","dim","Computing "+(state.kind==="leaderboard"?"leaderboard":"report")+"…"));},SLOW_REQUEST_MILLIS);}
      try{
        const response=await fetch(buildAPIURL(state),{headers:{Accept:"application/json"},signal:controller.signal});
        if(generation!==requestGeneration)return;
        if(!response.ok){let message="HTTP "+response.status;try{const body=await response.json();message=body.error?.message||message;}catch(_error){}if(response.status===400){connection(false,"invalid request",false);byId("report").replaceChildren(element("p","error",message));return;}throw new Error(message);}
        const report=await response.json();if(generation!==requestGeneration)return;
        const sameView=context===lastContext,previous=sameView?lastReport:null;
        // A quiet poll of the view already on screen must never yank a
        // control out from under an in-progress interaction: a native
        // <select>'s open dropdown has no DOM state to restore once its
        // element is destroyed, a rebuilt <summary>/<input>/<textarea>
        // silently drops the focus or in-progress text the user had, and
        // replaceChildren collapses any text selection the user is mid-way
        // through making -- fatal on iPhone, where a long-press selection has
        // to survive until the Copy tap lands.  Skip the visual apply in
        // that case only -- lastReport/lastContext still advance, so the
        // next poll (once focus moves on or the selection collapses) renders
        // current data rather than replaying this skipped one.  A real
        // navigation (sameView is false: Go, Back/Forward, clicking a card)
        // always renders regardless of focus or selection, since replacing
        // the old view is the point of navigating.
        if(!sameView||!(reportHasFocusedControl()||reportHasActiveSelection()))applyReport(report,previous,state);
        lastReport=report;lastContext=context;lastSuccess=Date.now();failureCount=0;connection(true,"connected");
        pinBranchToSpine(report,state);
      }
      catch(error){
        if(error.name==="AbortError"||generation!==requestGeneration)return;
        failureCount++;
        const navigated=context!==lastContext;
        if(navigated||failureCount>=2){
          const age=lastSuccess?Math.floor((Date.now()-lastSuccess)/1000)+"s":"never";
          connection(false,navigated?"error":"offline "+age);
          if(navigated||!lastReport)byId("report").replaceChildren(element("p","error",error.message));
        }
      }
      finally{clearSlowRequestNotice();if(activeRequestController===controller)activeRequestController=null;}
    }
    function pinBranchToSpine(report,state){
      // A spine remains the preferred URL because it resolves from the answer
      // list alone. Cache-resolved branches without a known spine keep their
      // durable reference instead.
      if(report.report_kind!=="branch"||report.tree)return;
      // Only a queue reference needs replacing; a spine the user typed is
      // already stable, so leave its wording untouched.
      if(!/^@/.test((state.branch_target||"").trim()))return;
      const spine=report.data&&report.data.branch&&report.data.branch.spine;
      if(!Array.isArray(spine)||!spine.length)return;
      const canonical=spine.flatMap(step=>[step.word,step.pattern]).join(" ");
      if(!canonical||canonical===state.branch_target)return;
      currentState=normalizeState({...currentState,branch_target:canonical});
      const query=stateQuery(currentState,true).toString();
      history.replaceState(null,"",location.pathname+(query?"?"+query:""));
      lastContext=contextKey(currentState);
      byId("branch-target-input").value=currentState.branch_target;shownBranchTarget=currentState.branch_target;
    }
    function schedulePoll(){clearTimeout(pollTimer);pollTimer=setTimeout(async()=>{await fetchReport();schedulePoll();},currentState.poll);}
    function initialize(){
      const addFilterControls=(containerId,names,dataName)=>{const container=byId(containerId);for(const name of names){const filterLabel=element("label"),input=element("input");input.type="checkbox";input.value=name;input.dataset[dataName]="1";filterLabel.append(input," "+name);container.append(filterLabel);}};
      addFilterControls("branch-statuses",branchStatusNames,"branchStatus");addFilterControls("branch-phases",branchPhaseNames,"branchPhase");
      currentState=parsePageState(location);syncControls();
      byId("apply").addEventListener("click",()=>setState({...readControls(),kind:"auto"}));byId("branch-target-input").addEventListener("keydown",event=>{if(event.key==="Enter")byId("apply").click();});byId("back").addEventListener("click",()=>history.back());
      byId("layout-flat").addEventListener("click",()=>setState({...readControls(),tree:false}));
      byId("layout-tree").addEventListener("click",()=>setState({...readControls(),tree:true,limit:10}));
      // Filters and view controls commit on change against the committed
      // branch_target, so a filter tweak never navigates to text typed but not yet
      // sent with Go/Enter.  replaceState keeps a run of tweaks to one Back step.
      const commitControls=()=>setState({...readControls(),branch_target:currentState.branch_target},false);
      document.querySelector("details.filters").addEventListener("change",commitControls);
      byId("poll").addEventListener("change",commitControls);
      const connWrap=byId("connection").closest(".conn-wrap"),connDot=byId("connection");
      connDot.setAttribute("role","button");connDot.setAttribute("tabindex","0");connDot.setAttribute("aria-expanded","false");
      const setRefreshOpen=open=>{connWrap.classList.toggle("open",open);connDot.setAttribute("aria-expanded",open?"true":"false");};
      connDot.addEventListener("click",event=>{event.stopPropagation();setRefreshOpen(!connWrap.classList.contains("open"));});
      connDot.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();setRefreshOpen(!connWrap.classList.contains("open"));}});
      document.addEventListener("click",event=>{if(!connWrap.contains(event.target))setRefreshOpen(false);});
      document.addEventListener("keydown",event=>{if(event.key==="Escape")setRefreshOpen(false);});
      document.querySelectorAll("[data-kind]").forEach(button=>button.addEventListener("click",()=>{const overview=button.dataset.overview;setState({...readControls(),kind:button.dataset.kind,branch_target:overview?"":currentState.branch_target,tree:false,branch_status:overview?["active"]:currentState.branch_status,branch_phase:overview?[]:currentState.branch_phase,minimum_answer_count:overview?null:currentState.minimum_answer_count,maximum_answer_count:overview?null:currentState.maximum_answer_count,budget:overview?null:currentState.budget,priority:overview?null:currentState.priority,sort:overview?"":currentState.sort,limit:overview?null:currentState.limit,answers:false,claims:false,finalization_cursor:""});}));
      installSpineCopy();
      addEventListener("resize",()=>layoutSpines(byId("report")));
      addEventListener("popstate",()=>{abortActiveRequest();currentState=parsePageState(location);syncControls();fetchReport();schedulePoll();});document.addEventListener("visibilitychange",()=>{if(!document.hidden){fetchReport();schedulePoll();}});fetchReport();schedulePoll();
    }
    window.parsePageState=parsePageState;window.buildAPIURL=buildAPIURL;window.rootProgressURL=rootProgressURL;window.renderRootProgressHeadline=renderRootProgressHeadline;window.applyReport=applyReport;window.spineTextFromSelection=spineTextFromSelection;window.__reportClient={setState:state=>setState(state),getState:()=>({...currentState}),fetchReport};
    document.addEventListener("DOMContentLoaded",initialize);
  })();
  </script>
